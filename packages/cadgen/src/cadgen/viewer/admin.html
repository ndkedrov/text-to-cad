<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>3D Maker · Admin</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #1c2127; --muted: #626b76; --line: #dfe3e8;
    --accent: #e8672a; --ok: #3f8f6b; --bad: #d1483f; --info: #4d7fb8; --soft: #eef1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121518; --panel: #1a1e23; --ink: #e9ebee; --muted: #9aa3ad; --line: #2b3138;
      --accent: #f07a3f; --ok: #5fb38b; --bad: #e0675f; --info: #6f9ed4; --soft: #222830;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
    padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .muted { color: var(--muted); }
  button, .button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 5px 10px; border-radius: 7px; cursor: pointer; text-decoration: none; }
  button:hover, .button:hover { border-color: var(--muted); }
  .langs { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; }
  .langs button { border: 0; padding: 4px 8px; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
  .langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  label.auto { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
  main { max-width: 1280px; margin: 0 auto; padding: 18px 20px 48px; display: grid; gap: 16px; }
  .status { margin: 0; min-height: 1em; }
  .status.error { color: var(--bad); font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card .label { font-size: 12px; color: var(--muted); }
  .card .value { font-size: 26px; font-weight: 700; letter-spacing: -.01em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .panel h2 { font-size: 14px; margin: 0 0 10px; }
  .panel-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .panel-head h2 { margin: 0; }
  input[type="search"] { font: inherit; font-size: 13px; padding: 5px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 220px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--soft); }
  .pill.ok { color: var(--ok); } .pill.bad { color: var(--bad); } .pill.info { color: var(--info); } .pill.warn { color: var(--accent); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 13px; }
  [hidden] { display: none !important; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .presets { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; align-items: start; }
  @media (max-width: 960px) { .presets { grid-template-columns: 1fr; } }
  .row-actions { display: flex; gap: 4px; }
  #presets-list td button, .editor td button { padding: 2px 7px; font-size: 12px; }
  tr.selected td { background: var(--soft); }
  .editor { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
  .editor h3 { font-size: 13px; margin: 4px 0 0; }
  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px 10px; }
  .fields label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  .editor input, .editor select, textarea { font: inherit; font-size: 13px; padding: 4px 7px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
  .editor td input, .editor td select { min-width: 70px; }
  .editor td { padding: 3px 4px; }
  .preview svg { width: 100%; max-height: 240px; display: block; }
  textarea { min-height: 380px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; margin-bottom: 8px; }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">3D Maker <span class="tag" data-t="admin">Admin</span></div>
  <div class="actions">
    <span id="generated" class="muted"></span>
    <label class="auto"><input type="checkbox" id="auto" checked> <span data-t="auto">Auto-refresh</span></label>
    <button type="button" id="refresh" data-t="refresh">Refresh</button>
    <div class="langs" role="group" aria-label="Language / Мова">
      <button type="button" data-lang="uk" lang="uk">УКР</button>
      <button type="button" data-lang="en" lang="en">ENG</button>
    </div>
    <a class="button" href="/" data-t="back">Back to the builder</a>
  </div>
</header>
<main>
  <p id="status" class="status" role="status"></p>
  <section id="cards" class="cards" aria-live="polite"></section>
  <section class="grid2">
    <div class="panel"><h2 data-t="chartBuilds">Builds per day</h2><div id="chart-builds" class="chart"></div></div>
    <div class="panel"><h2 data-t="chartPeople">People per day</h2><div id="chart-people" class="chart"></div></div>
  </section>
  <section class="grid2">
    <div class="panel"><h2 data-t="rejects">Refusals, 30 days</h2><div id="rejects"></div></div>
    <div class="panel"><h2 data-t="system">Service</h2><div id="system"></div></div>
  </section>
  <section class="panel">
    <div class="panel-head">
      <h2 data-t="accounts">Accounts</h2>
      <input id="filter" type="search" autocomplete="off">
    </div>
    <div class="scroll"><table id="accounts"></table></div>
  </section>
  <section class="panel">
    <h2 data-t="recent">Recent activity</h2>
    <div class="scroll"><table id="recent"></table></div>
  </section>
  <section class="panel" id="presets-panel">
    <div class="panel-head">
      <h2 data-t="presets">Board presets</h2>
      <div class="row">
        <span id="presets-state" class="muted"></span>
        <button type="button" id="preset-new" data-t="presetNew">New preset</button>
        <button type="button" id="presets-json" data-t="presetsJson">Edit as JSON</button>
        <button type="button" id="presets-reset" data-t="presetsReset">Reset to defaults</button>
      </div>
    </div>
    <p id="presets-status" class="status" role="status"></p>
    <div id="presets-json-box" hidden>
      <textarea id="presets-json-text" spellcheck="false" aria-label="JSON"></textarea>
      <div class="row">
        <button type="button" id="presets-json-apply" class="primary" data-t="saveList">Save and publish</button>
        <button type="button" id="presets-json-cancel" data-t="cancel">Cancel</button>
      </div>
    </div>
    <div id="presets-main" class="presets">
      <div>
        <div class="row" id="presets-filter-row"></div>
        <div class="scroll"><table id="presets-list"></table></div>
      </div>
      <div id="preset-editor"></div>
    </div>
  </section>
</main>

  var state = { lang: pickLanguage(), data: null, timer: 0, filter: "" };

  function t(key, params) {

    Object.keys(params || {}).forEach(function (name) {
      text = text.split("{" + name + "}").join(String(params[name]));
    });
    return text;
  }

  function locale() { return state.lang === "uk" ? "uk-UA" : "en-GB"; }

  // Every value from the server goes in through textContent: nothing is parsed as HTML.
  function el(tag, attributes, children) {
    var node = document.createElement(tag);
    Object.keys(attributes || {}).forEach(function (name) {
      if (name === "class") { node.className = attributes[name]; }
      else if (name === "text") { node.textContent = attributes[name]; }
      else { node.setAttribute(name, attributes[name]); }

    (children || []).forEach(function (child) {

  function number(value) { return value === null || value === undefined ? "—" : new Intl.NumberFormat(locale()).format(value); }

    if (value === null || value === undefined) { return "—"; }
    var units = ["B", "KB", "MB", "GB", "TB"];
    var size = Number(value); var index = 0;
    while (size >= 1024 && index < units.length - 1) { size /= 1024; index += 1; }
    return new Intl.NumberFormat(locale(), { maximumFractionDigits: size < 10 && index ? 1 : 0 }).format(size) + " " + units[index];
  }
  function dateTime(epoch) {
    if (!epoch) { return "—"; }

  function relative(epoch) {

    var steps = [["year", 31536000], ["month", 2592000], ["day", 86400], ["hour", 3600], ["minute", 60]];

    return format.format(seconds, "second");
  }
  function secondsText(value) {

  function renderCards(data) {

  // Bars per day. `bars` lists {key, color, label}; stacked bars add up, grouped ones sit side by side.
  function barChart(containerId, rows, bars, stacked) {
    var width = 640; var height = 190; var left = 34; var bottom = 22; var top = 8;
    var plotWidth = width - left - 6; var plotHeight = height - bottom - top;
    var maximum = 0;
    rows.forEach(function (row) {
      var total = 0;
      bars.forEach(function (bar) { total = stacked ? total + (row[bar.key] || 0) : Math.max(total, row[bar.key] || 0); });
      maximum = Math.max(maximum, total);
    });
    var ceiling = Math.max(1, Math.ceil(maximum * 1.1));
    var svg = svgNode("svg", { viewBox: "0 0 " + width + " " + height, role: "img" });
    [0, 0.5, 1].forEach(function (fraction) {
      var y = top + plotHeight * (1 - fraction);
      svg.appendChild(svgNode("line", { x1: left, x2: width - 6, y1: y, y2: y, stroke: "var(--line)", "stroke-width": 1 }));
      var label = svgNode("text", { x: left - 6, y: y + 4, "text-anchor": "end", "font-size": 10, fill: "var(--muted)" });
      label.textContent = number(Math.round(ceiling * fraction));
      svg.appendChild(label);
    });
    var slot = plotWidth / Math.max(rows.length, 1);
    rows.forEach(function (row, index) {
      var x = left + index * slot;
      var tooltip = [row.day].concat(bars.map(function (bar) { return bar.label + ": " + number(row[bar.key] || 0); })).join("\n");
      if (stacked) {
        var base = top + plotHeight;
        bars.forEach(function (bar) {
          var value = row[bar.key] || 0; var barHeight = plotHeight * value / ceiling;
          if (value > 0) {
            var rect = svgNode("rect", { x: x + slot * 0.15, y: base - barHeight, width: slot * 0.7, height: barHeight, rx: 1.5, fill: bar.color });
            var title = svgNode("title", {}); title.textContent = tooltip; rect.appendChild(title);
            svg.appendChild(rect);
          }
          base -= barHeight;
        });
      } else {
        var inner = slot * 0.8 / bars.length;
        bars.forEach(function (bar, barIndex) {
          var value = row[bar.key] || 0; var barHeight = plotHeight * value / ceiling;
          if (value > 0) {
            var rect = svgNode("rect", { x: x + slot * 0.1 + barIndex * inner, y: top + plotHeight - barHeight, width: inner * 0.9, height: barHeight, rx: 1.5, fill: bar.color });
            var title = svgNode("title", {}); title.textContent = tooltip; rect.appendChild(title);
            svg.appendChild(rect);
          }
        });
      }
      if (index % 5 === 0 || index === rows.length - 1) {
        var dayLabel = svgNode("text", { x: x + slot / 2, y: height - 6, "text-anchor": "middle", "font-size": 10, fill: "var(--muted)" });
        dayLabel.textContent = String(row.day).slice(5);
        svg.appendChild(dayLabel);
      }
    });
    var legend = el("div", { class: "legend" }, bars.map(function (bar) {
      var swatch = el("i"); swatch.style.background = bar.color;
      return el("span", {}, [swatch, bar.label]);
    }));
    var container = document.getElementById(containerId);
    container.replaceChildren(svg, legend);
  }

  function renderCharts(data) {

  function renderSystem(data) {

  function withTitle(text, title) { var span = el("span", { text: text }); span.title = title; return span; }
  function pill(text, tone) { return el("span", { class: "pill " + (tone || ""), text: text }); }

  function renderAccounts(data) {

      return [

  function eventCells(event) {
    var kind = event.e; var details = el("span");

    }
    if (kind === "build") {

  function render() {

    var data = state.data;

  function load() {
    if (!state.data) { setStatus(t("loading")); }

      .then(function (response) {
        if (response.status === 401 || response.status === 403 || response.status === 404) { throw new Error(t("noAccess")); }
        if (!response.ok) { throw new Error("HTTP " + response.status); }

      .catch(function (error) { setStatus(error.message || String(error), true); });

  // --- board presets ---------------------------------------------------------
  // Every change is sent at once and the list shown is always what the server

  // new one, null none); draft: its working copy until "Save and publish".

  var presets = { boards: [], defaults: [], portTypes: {}, categories: [], filter: "all", edited: false, loaded: false, index: null, draft: null };

  function categoryName(id) { return TEXT.en["cat_" + id] ? t("cat_" + id) : String(id); }
  var PORT_EDGES = ["front", "back", "left", "right"];
  var MAX_ITEMS = 8;

  function clone(value) { return JSON.parse(JSON.stringify(value)); }

  function slug(name, taken) {

    if (base === "custom") { base = "custom-board"; }

    return id;
  }

      width: size.width, height: size.height, radius: size.radius, overhang: 0, margin: size.margin != null ? size.margin : 0.5 };

  // Whether the editor holds changes that were never saved.

  function renderPresetList() {
    var counts = {};
    presets.boards.forEach(function (board) { counts[board.category] = (counts[board.category] || 0) + 1; });
    if (presets.filter !== "all" && !counts[presets.filter]) { presets.filter = "all"; }
    var filter = selectInput(
      [["all", t("filterAll") + " (" + number(presets.boards.length) + ")"]].concat(presets.categories
        .filter(function (id) { return counts[id]; })
        .map(function (id) { return [id, categoryName(id) + " (" + number(counts[id]) + ")"]; })),
      presets.filter,
      function (value) { presets.filter = value; renderPresetList(); }
    );
    filter.setAttribute("aria-label", t("pCategory"));
    document.getElementById("presets-filter-row").replaceChildren(el("span", { class: "muted", text: t("pCategory") }), filter);
    // Reordering only makes sense on the whole list.
    var filtered = presets.filter !== "all";
    var visible = [];
    var rows = [];
    presets.boards.forEach(function (board, index) {
      if (filtered && board.category !== presets.filter) { return; }
      visible.push(index);
      rows.push([board.name, categoryName(board.category), mm(board.width) + " × " + mm(board.length), number(board.holes.length), number(board.ports.length),

          actionButton(t("remove"), function () { removePreset(index); })
        ])]);
    });
    table("presets-list", [
      { label: t("pName") }, { label: t("pCategory") }, { label: t("pSize") }, { label: t("pHoles"), num: true },
      { label: t("pPorts"), num: true }, { label: "" }
    ], rows, t("noPresets"));
    Array.prototype.forEach.call(document.querySelectorAll("#presets-list tbody tr"), function (row, position) {

  function openEditor(index) {

  // A top view of the draft: the board, its holes with their standoff pads, and its ports.
  function drawPreview() {
    var holder = document.getElementById("preset-preview");
    var draft = presets.draft;
    if (!holder || !draft) { return; }
    var hint = document.getElementById("draft-hint");
    if (hint) { hint.textContent = draftChanged() ? t("draftUnsaved") : ""; }
    var width = Math.max(Number(draft.width) || 1, 1); var length = Math.max(Number(draft.length) || 1, 1);
    var margin = 14; var scale = Math.min(520 / width, 200 / length);
    var svg = svgNode("svg", { viewBox: "0 0 " + (width * scale + margin * 2) + " " + (length * scale + margin * 2), role: "img" });
    function sx(x) { return margin + x * scale; }
    function sy(y) { return margin + (length - y) * scale; }
    svg.appendChild(svgNode("rect", { x: sx(0), y: sy(length), width: width * scale, height: length * scale, rx: 3,
      fill: "#2f8f5b", "fill-opacity": 0.3, stroke: "#2f8f5b" }));
    draft.holes.forEach(function (hole) {
      svg.appendChild(svgNode("circle", { cx: sx(hole.x), cy: sy(hole.y), r: Math.max((Number(draft.padDiameter) || 0) / 2 * scale, 1),
        fill: "none", stroke: "var(--muted)", "stroke-dasharray": "3 2" }));
      svg.appendChild(svgNode("circle", { cx: sx(hole.x), cy: sy(hole.y), r: Math.max((Number(hole.diameter) || 0) / 2 * scale, 1),
        fill: "var(--panel)", stroke: "var(--ink)" }));
    });
    draft.ports.forEach(function (port, index) {
      var body = 6; var out = Number(port.overhang) || 0; var size = Number(port.width) || 1; var along = Number(port.offset) || 0;
      var box;
      if (port.edge === "back") { box = [along - size / 2, length - body, size, body + out]; }
      else if (port.edge === "left") { box = [-out, along - size / 2, body + out, size]; }
      else if (port.edge === "right") { box = [width - body, along - size / 2, body + out, size]; }
      else { box = [along - size / 2, -out, size, body + out]; }
      svg.appendChild(svgNode("rect", { x: sx(box[0]), y: sy(box[1] + box[3]), width: box[2] * scale, height: box[3] * scale,
        fill: "var(--accent)", "fill-opacity": 0.55, stroke: "var(--accent)" }));
      var label = svgNode("text", { x: sx(box[0] + box[2] / 2), y: sy(box[1] + box[3] / 2) + 3, "text-anchor": "middle", "font-size": 9, fill: "var(--ink)" });
      label.textContent = String(index + 1);
      svg.appendChild(label);
    });
    holder.replaceChildren(svg);
  }

  function renderEditor() {
    var holder = document.getElementById("preset-editor");
    var draft = presets.draft;
    if (!draft) { holder.replaceChildren(el("p", { class: "empty", text: t("pickPreset") })); return; }
    var nameInput = el("input", { type: "text", maxlength: "60", value: draft.name });
    nameInput.addEventListener("input", function () { draft.name = nameInput.value; drawPreview(); });
    var idInput = el("input", { type: "text", maxlength: "40", value: draft.id, placeholder: "auto" });
    idInput.addEventListener("input", function () { draft.id = idInput.value.trim(); drawPreview(); });
    var holeRows = draft.holes.map(function (hole, index) {
      return el("tr", {}, [
        el("td", {}, [numberInput(hole, "x", 0.1)]), el("td", {}, [numberInput(hole, "y", 0.1)]), el("td", {}, [numberInput(hole, "diameter", 0.1)]),
        el("td", {}, [actionButton(t("remove"), function () { draft.holes.splice(index, 1); renderEditor(); })])
      ]);
    });
    var typeOptions = Object.keys(presets.portTypes).map(function (type) { return [type, t("pt_" + type)]; });
    var portRows = draft.ports.map(function (port, index) {
      return el("tr", {}, [
        el("td", {}, [selectInput(typeOptions, port.type, function (type) {
          draft.ports[index] = Object.assign(newPort(type), { edge: port.edge, offset: port.offset, overhang: port.overhang, margin: port.margin });
          renderEditor();
        })]),
        el("td", {}, [selectInput(PORT_EDGES.map(function (edge) { return [edge, t("edge_" + edge)]; }), port.edge, function (edge) { port.edge = edge; drawPreview(); })]),
        el("td", {}, [selectInput([["rect", t("shape_rect")], ["circle", t("shape_circle")]], port.shape, function (shape) {
          port.shape = shape;
          if (shape === "circle") { port.height = port.width; port.radius = 0; }
          renderEditor();
        })]),
        el("td", {}, [numberInput(port, "offset", 0.1)]),
        el("td", {}, [numberInput(port, "elevation", 0.25)]),
        el("td", {}, [numberInput(port, "width", 0.1, function () { if (port.shape === "circle") { port.height = port.width; } drawPreview(); })]),
        el("td", {}, [numberInput(port, "height", 0.1)]),
        el("td", {}, [numberInput(port, "radius", 0.1)]),
        el("td", {}, [numberInput(port, "overhang", 0.5)]),
        el("td", {}, [numberInput(port, "margin", 0.1)]),
        el("td", {}, [actionButton(t("remove"), function () { draft.ports.splice(index, 1); renderEditor(); })])
      ]);
    });
    function header(labels) { return el("thead", {}, [el("tr", {}, labels.map(function (label) { return el("th", { text: label }); }))]); }
    holder.replaceChildren(el("div", { class: "editor" }, [
      el("h3", { text: presets.index === -1 ? t("editorNew") : t("editorTitle") + " · " + ((presets.boards[presets.index] || {}).name || "") }),
      el("div", { class: "preview", id: "preset-preview" }),
      el("div", { class: "fields" }, [
        labelled(t("pName"), nameInput), labelled(t("pId"), idInput),
        labelled(t("pCategory"), selectInput(presets.categories.map(function (id) { return [id, categoryName(id)]; }), draft.category,
          function (value) { draft.category = value; drawPreview(); })),
        labelled(t("fWidth"), numberInput(draft, "width", 0.1)), labelled(t("fLength"), numberInput(draft, "length", 0.1)),
        labelled(t("fThickness"), numberInput(draft, "thickness", 0.1)), labelled(t("fClearance"), numberInput(draft, "clearance", 0.5)),
        labelled(t("fComponent"), numberInput(draft, "componentHeight", 0.5)), labelled(t("fPad"), numberInput(draft, "padDiameter", 0.5)),
        labelled(t("fBore"), numberInput(draft, "boreDiameter", 0.1))
      ]),
      el("h3", { text: t("holesTitle") }),
      el("div", { class: "scroll" }, [el("table", {}, [header([t("hX"), t("hY"), t("hD"), ""]), el("tbody", {}, holeRows)])]),
      el("div", { class: "row" }, [actionButton(t("addHole"), function () {
        draft.holes.push({ x: Math.round(draft.width * 5) / 10, y: Math.round(draft.length * 5) / 10, diameter: 3.2 });
        renderEditor();
      }, draft.holes.length >= MAX_ITEMS)]),
      el("h3", { text: t("portsTitle") }),
      el("div", { class: "scroll" }, [el("table", {}, [header([t("portType"), t("portEdge"), t("portShape"), t("portOffset"), t("portElevation"),
        t("portWidth"), t("portHeight"), t("portRadius"), t("portOverhang"), t("portMargin"), ""]), el("tbody", {}, portRows)])]),
      el("div", { class: "row" }, [actionButton(t("addPort"), function () {
        var port = newPort("usbC");
        port.offset = Math.round(draft.width * 5) / 10;
        draft.ports.push(port);
        renderEditor();
      }, draft.ports.length >= MAX_ITEMS)]),
      el("div", { class: "row" }, [actionButton(t("applyPreset"), applyDraft, false, "primary"), actionButton(t("cancel"), closeEditor),
        el("span", { class: "muted", id: "draft-hint" })])
    ]));
    drawPreview();
  }

  function applyDraft() {
    var draft = clone(presets.draft);
    draft.name = String(draft.name || "").trim();
    if (!draft.name) { presetStatus(t("nameRequired"), true); return; }
    var taken = presets.boards.filter(function (board, index) { return index !== presets.index; }).map(function (board) { return board.id; });
    if (!draft.id) { draft.id = slug(draft.name, taken); }
    if (taken.indexOf(draft.id) !== -1) { presetStatus(t("idTaken", { id: draft.id }), true); return; }
    var next = clone(presets.boards);
    var position = presets.index === -1 ? next.length : presets.index;
    next[position] = draft;
    // A refused save keeps the editor as it is, so nothing typed is lost.
    sendPresets({ boards: next }, function () {
      presets.index = position;
      presets.draft = clone(presets.boards[position]);
    });
  }

  function movePreset(index, delta) {
    var target = index + delta;
    if (target < 0 || target >= presets.boards.length) { return; }
    var next = clone(presets.boards);
    next.splice(target, 0, next.splice(index, 1)[0]);
    var editing = presets.index;
    sendPresets({ boards: next }, function () {
      if (editing === index) { presets.index = target; } else if (editing === target) { presets.index = index; }
    });
  }

  function duplicatePreset(index) {
    if (!mayLeaveDraft()) { return; }
    var next = clone(presets.boards);
    var copy = clone(next[index]);
    copy.name = (copy.name + " (2)").slice(0, 60);
    copy.id = slug(copy.name, next.map(function (board) { return board.id; }));
    next.splice(index + 1, 0, copy);
    sendPresets({ boards: next }, function () {
      presets.index = index + 1;
      presets.draft = clone(presets.boards[index + 1]);
    });
  }

  function removePreset(index) {
    if (!window.confirm(t("presetsConfirmDelete", { name: presets.boards[index].name }))) { return; }
    var next = clone(presets.boards);
    next.splice(index, 1);
    var editing = presets.index;
    sendPresets({ boards: next }, function () {
      if (editing === index) { presets.index = null; presets.draft = null; }
      else if (editing !== null && editing > index) { presets.index = editing - 1; }
    });
  }

  function takePresets(payload) {
    presets.boards = Array.isArray(payload.boards) ? payload.boards : [];
    presets.defaults = Array.isArray(payload.defaults) ? payload.defaults : [];
    presets.portTypes = payload.portTypes || {};
    presets.categories = Array.isArray(payload.categories) ? payload.categories : [];
    presets.edited = Boolean(payload.edited);
    presets.loaded = true;
    if (presets.index !== null && presets.index >= presets.boards.length) { presets.index = null; presets.draft = null; }
  }

  function presetRequest(method, body) {
    var options = { method: method, cache: "no-store", credentials: "same-origin" };
    if (method === "POST") {
      options.headers = { "content-type": "application/json", "x-cadgen-viewer": "1" };
      options.body = JSON.stringify(body);
    }
    return fetch("/__cad/admin/presets", options).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (payload) {
        if (!response.ok) { throw new Error(payload.error || ("HTTP " + response.status)); }
        return payload;
      });
    });
  }

  function loadPresets() {
    presetRequest("GET")
      .then(function (payload) { takePresets(payload); renderPresetList(); renderEditor(); })
      .catch(function (error) { presetStatus(t("presetsLoadError", { error: error.message }), true); });
  }

  // Sends the whole list (or a reset); on success the server's answer becomes the
  // list shown, `onSaved` adjusts the editor to it, and both are drawn again.
  function sendPresets(body, onSaved) {
    presetStatus(t("saving"));
    return presetRequest("POST", body)
      .then(function (payload) {
        takePresets(payload);
        if (onSaved) { onSaved(); }
        renderPresetList();
        renderEditor();
        presetStatus(t("presetsPublished"));
        return true;
      })
      .catch(function (error) { presetStatus(error.message || String(error), true); return false; });
  }

  function showJson(open) {
    document.getElementById("presets-json-box").hidden = !open;
    document.getElementById("presets-main").hidden = open;
    if (open) { document.getElementById("presets-json-text").value = JSON.stringify(presets.boards, null, 2); }
  }

  document.getElementById("preset-new").addEventListener("click", function () { showJson(false); openEditor(-1); });
  document.getElementById("presets-reset").addEventListener("click", function () {
    if (!window.confirm(t("presetsConfirmReset"))) { return; }
    sendPresets({ reset: true }, function () { presets.index = null; presets.draft = null; });
  });
  document.getElementById("presets-json").addEventListener("click", function () { showJson(true); });
  document.getElementById("presets-json-cancel").addEventListener("click", function () { showJson(false); });
  document.getElementById("presets-json-apply").addEventListener("click", function () {
    var parsed;
    try { parsed = JSON.parse(document.getElementById("presets-json-text").value); }
    catch (error) { presetStatus(t("presetsInvalidJson", { error: error.message }), true); return; }
    if (!Array.isArray(parsed)) { presetStatus(t("presetsJsonList"), true); return; }
    sendPresets({ boards: parsed }, function () { presets.index = null; presets.draft = null; showJson(false); });
  });
  window.addEventListener("beforeunload", function (event) {
    if (draftChanged()) { event.preventDefault(); event.returnValue = t("presetsDiscard"); }
  });

  document.getElementById("refresh").addEventListener("click", load);
  document.getElementById("auto").addEventListener("change", schedule);
  document.getElementById("filter").addEventListener("input", function (event) {
    state.filter = event.target.value;
    if (state.data) { renderAccounts(state.data); }
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"), function (button) {
    button.addEventListener("click", function () {
      state.lang = button.getAttribute("data-lang");
      try { localStorage.setItem("3dmaker:lang", state.lang); } catch (error) { /* storage blocked */ }
      render();
    });
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && document.getElementById("auto").checked) { load(); } });

  applyStaticText();
  load();
  loadPresets();
  schedule();
})();
</script>
</body>
</html>
